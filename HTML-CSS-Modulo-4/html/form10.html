<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        body {
            background-color: brown;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="../js/cadastro.js" method="get" autocomplete="on">
        <p>
            <label for="inAno">Ano que Você Nasceu: </label>
            <input type="number" name="ano" id="inAno" required min="1900" max="2026" oninput="cacularIdade()">
        </p>

        <p>
            <label for="inNasceu">Entao sua idade é: </label>
            <output name="nasceu" id="inNasceu">0</output>
        </p>
    </form>
<script>
    function cacularIdade() {
        const anoAtual = new Date().getFullYear();
        inNasceu.innerHTML = Number(anoAtual) - Number(inAno.value);
    }
</script>
</body>
</html>
