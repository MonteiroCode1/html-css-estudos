<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        body {
            background-color: brown;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="../js/cadastro.js" method="get" autocomplete="on">
        <p>
            <label for="in1">Numero 1:</label>
            <input type="number" name="numero1" id="in1" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>

        <p>
            <label for="in2">Numero 2:</label>
            <input type="number" name="numero2" id="in2" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>

        <p>
            <label for="isoma">Soma: </label>
            <output name="soma" id="isoma">0</output>
        </p>

        <input type="submit" value="enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
