<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        body {
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>formulario</h1>
    <form action="../js/cadastro.js" method="post" autocomplete="on">
        <p>
            <label for="inNome">Nome</label>
            <input type="text" name="nome" id="inNome" required minlength="5" maxlength="10" autocomplete="username" size="10">
        </p>
        <p>
            <label for="inSenha">Senha</label>
            <input type="password" name="senha" id="inSenha" required minlength="5" maxlength="10" autocomplete="new-password" size="10">
        </p>
        <input type="submit">
        <input type="reset">
    </form>
</body>
</html>
